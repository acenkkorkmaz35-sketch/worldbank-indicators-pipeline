[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-pipeline"
version = "0.1.0"
description = "Config-driven, idempotent World Bank indicators pipeline (Python ingestion + dbt on DuckDB)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "pyyaml>=6,<7",
    "pydantic>=2.5,<3",
    "duckdb>=1.1",
    "dbt-core>=1.11,<1.13",
    "dbt-duckdb>=1.11,<1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wb-pipeline = "wb_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: runs dbt end-to-end against a temporary DuckDB file (offline)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # allow typographic characters in docs/comments

[tool.ruff.lint.isort]
known-first-party = ["wb_pipeline"]
known-local-folder = ["conftest", "fake_api"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # inline SQL assertions read better unwrapped

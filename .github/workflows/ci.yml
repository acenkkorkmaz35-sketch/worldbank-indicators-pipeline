name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  single-command:
    # The README's one command, from a clean checkout, on every OS - against the live API.
    name: "python run.py (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python run.py (fresh checkout -> venv -> ingest -> dbt build -> export)
        run: python run.py
      - name: re-run is idempotent (no new payloads, no changed fact rows)
        run: |
          python run.py 2>&1 | tee rerun.log
          grep -q "0 new payload(s)" rerun.log
          VPY=.venv/bin/python; [ -f .venv/Scripts/python.exe ] && VPY=.venv/Scripts/python.exe
          "$VPY" -c "
          import duckdb
          con = duckdb.connect('data/warehouse.duckdb', read_only=True)
          n, changed = con.execute('select count(*), count(distinct last_changed_at) from core.fct_indicator_value').fetchone()
          assert (n, changed) == (252, 1), (n, changed)
          print('fact rows:', n, '| distinct last_changed_at:', changed)
          "
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: reporting-output
          path: output/

  tests:
    name: "lint + tests (offline, Python ${{ matrix.python }})"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python run.py lint
      - run: python run.py test

  docker:
    name: docker (optional path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wb-pipeline .
      - run: docker run --rm --entrypoint python wb-pipeline -m pytest -q
      - run: docker run --rm -v "${PWD}/output:/app/output" wb-pipeline
